<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Heroes Admin</title><style>body{background:#111;color:#fff;font-family:sans-serif;margin:0}h1{background:#facc15;color:#000;padding:16px;margin:0;text-align:center}div{padding:16px}input{width:100%;padding:14px;border-radius:12px;border:1px solid #333;background:#000;color:#fff;margin:8px 0}button{width:100%;padding:14px;background:#facc15;color:#000;border:0;border-radius:12px;font-weight:900}.card{background:#222;border-radius:16px;padding:14px;margin:10px 0}small{color:#999}</style></head><body><h1>🛡️ HEROES ADMIN</h1><div id="l"><div class="card"><b>Password: heroes2025</b><input id="p" type="password" placeholder="Enter password"><button onclick="if(document.getElementById('p').value==='heroes2025'){localStorage.setItem('h','1');location.reload()}else alert('Wrong')">ENTER →</button></div></div><div id="a" style="display:none"><div class="card"><button onclick="localStorage.removeItem('h');location.reload()" style="width:auto;background:#333;color:#fff">Logout</button> <a href="../"><button style="width:auto;background:#333;color:#fff">View Site</button></a></div><div style="padding:12px"><b style="color:#facc15">ADD CONTENT</b><div class="card"><input id="t" placeholder="Title"><input id="b" placeholder="Description / Link"><button onclick="let x=JSON.parse(localStorage.getItem('d')||'[]');x.push({t:document.getElementById('t').value,b:document.getElementById('b').value,d:new Date().toLocaleDateString()});localStorage.setItem('d',JSON.stringify(x));document.getElementById('t').value='';document.getElementById('b').value='';render();alert('Saved!')">+ SAVE</button></div><div id="list"></div><div class="card"><button onclick="let b=new Blob([localStorage.getItem('d')||'[]'],{type:'application/json'});let u=URL.createObjectURL(b);let a=document.createElement('a');a.href=u;a.download='data.json';a.click()" style="margin-top:8px;background:#22c55e">EXPORT JSON</button></div></div></div><script>if(localStorage.getItem('h')){document.getElementById('l').style.display='none';document.getElementById('a').style.display='block';render()}function render(){let c=document.getElementById('list');let d=JSON.parse(localStorage.getItem('d')||'[]');c.innerHTML=d.map((x,i)=>`<div class=card>${x.t}<br><small>${x.b} - ${x.d}</small><br><button onclick="let a=JSON.parse(localStorage.getItem('d'));a.splice(${i},1);localStorage.setItem('d',JSON.stringify(a));render()" style="width:auto;padding:6px 12px;margin-top:6px;background:#333;color:#fff">Delete</button></div>`).join('')||'<small>No items</small>'}</script></body></html>
