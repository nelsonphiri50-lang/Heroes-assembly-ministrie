backend:
  name: github
  repo: nelsonphiri50-lang/Heroes-assembly-ministrie
  branch: main
  auth_type: pkce
  app_id: Ov23lijAg53Fbbu40NYz

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
    - name: "announcements"
    label: "Announcements"
    folder: "announcements"
    create: true
    slug: "{{slug}}"
    fields:
            - {label: "Title", name: "title", widget: "string"}
            - {label: "Body", name: "body", widget: "markdown"}
