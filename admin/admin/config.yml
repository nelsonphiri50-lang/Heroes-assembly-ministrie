backend:
  name: git-gateway
  branch: main
media_folder: "images/uploads"
public_folder: "/images/uploads"
collections:
    - name: "announcements"
    label: "Announcements"
    folder: "content/announcements"
    create: true
    fields:
            - {label: "Title", name: "title", widget: "string"}
            - {label: "Date", name: "date", widget: "datetime"}
            - {label: "Body", name: "body", widget: "markdown"}
    - name: "photos"
    label: "Photos"
    folder: "content/photos"
    create: true
    fields:
            - {label: "Title", name: "title", widget: "string"}
            - {label: "Image", name: "image", widget: "image"}
    - name: "videos"
    label: "Videos"
    folder: "content/videos"
    create: true
    fields:
            - {label: "Title", name: "title", widget: "string"}
            - {label: "YouTube Link", name: "youtube", widget: "string"}
    - name: "songs"
    label: "Songs"
    folder: "content/songs"
    create: true
    fields:
            - {label: "Title", name: "title", widget: "string"}
            - {label: "Audio Link", name: "audio", widget: "string"}
