backend:
  name: github
  repo: nelsonphiri50-lang/nelsonphiri50-lang.github.io
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "books"
    label: "Books"
    folder: "books"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Author", name: "author", widget: "string", default: "Apostle Nelson Azekah Phiri"}
      - {label: "Cover Image", name: "cover", widget: "image"}
      - {label: "PDF/File", name: "file", widget: "file", required: false}
      - {label: "Description", name: "body", widget: "markdown"}
  - name: "songs"
    label: "Songs"
    folder: "songs"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Artist", name: "artist", widget: "string"}
      - {label: "Audio File", name: "audio", widget: "file"}
      - {label: "Cover", name: "cover", widget: "image", required: false}
      - {label: "Lyrics/Info", name: "body", widget: "markdown", required: false}
  - name: "sermons"
    label: "Sermons"
    folder: "sermons"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Date", name: "date", widget: "datetime"}
      - {label: "Video Link (YouTube)", name: "video", widget: "string", required: false}
      - {label: "Body", name: "body", widget: "markdown"}
  - name: "testimonies"
    label: "Testimonies"
    folder: "testimonies"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Name", name: "name", widget: "string"}
      - {label: "Testimony", name: "body", widget: "text"}
      - {label: "Date", name: "date", widget: "datetime", default: "{{now}}"}
