backend:
  name: git-gateway
  branch: main

media_folder: "public/uploads"
public_folder: "/uploads"

collections:
    - name: "media"
    label: "Media"
    files:
            - label: "Media Library"
        name: "library"
        file: "src/content/media.json"
        fields:
                    - {label: "Videos", name: "videos", widget: "list", fields: [{label: "Title", name: "title", widget: "string"}, {label: "URL", name: "url", widget: "string"}]}
                    - {label: "Photos", name: "photos", widget: "list", fields: [{label: "Title", name: "title", widget: "string"}, {label: "Image", name: "image", widget: "image"}]}
